name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Boost (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install boost-interprocess:x64-windows

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release

      # Одна касса — сверка обязана сойтись. Несколько касс — только печатаем итог:
      # в стартовом коде синхронизации нет, и ошибка сверки там ожидаема.
      - name: Run
        shell: bash
        run: |
          exe=build/station
          [ "$RUNNER_OS" = "Windows" ] && exe=build/Release/station.exe
          "$exe" --run --offices 1 --seconds 2
          "$exe" --run --offices 4 --seconds 2 || true
